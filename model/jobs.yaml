# Layer 2: who owns what. v2 2026-11-17 (Phase 1 card engine). Change only on Zack's approval.
# Rules (Zack): class whose skills buff the activity wins; same class -> better one keeps class jobs, the other
# takes account jobs; no class owner -> lightest load (basis: light). Never guess. Never skip a job: defer with a reason.
# basis: griffy | zack | autoreview | class | light
# Section entry: "Name" (every open item) or {s: Name, m: regex, rest: true}
#   m    = keep only leaves whose "group/tab :: label" matches (case-insensitive)
#   rest = keep leaves of that section NOT claimed by any m-filter elsewhere
# afk / move / locked: {text, src}. src = creator + video, AutoReview, wiki, zack, fan (flagged), or GAP.
# active: ids from active_tasks below.

exclude:   # leaves never shown (Zack's calls)
  - "Prayer not needed"   # Royal Sampler stays on (Zack)
  - "more WOWs with"      # WOWs skipped (Griffy, findings/death_note_two_dbs.md)
  - "^Blue Ribbon Certification|^Extended Database"   # Legend Talents held (Zack 11/16). Zack 2026-11-27: next time legend points come up or are spendable, give a full pick list from everything (tiers, goal chain, blockers) and re-decide these

