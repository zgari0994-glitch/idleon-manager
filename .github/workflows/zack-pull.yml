# Zack's pull without the PC: phone upload page (idleon-brother.pages.dev/zack.html) commits the raw save to
# inbox/zack/raw.json.gz -> this runs the same pipeline as the PC pull thread -> commits snapshot + cards.
# Runs on GitHub's free runners: no Claude usage. Manual rerun: Actions -> zack-pull -> Run workflow.
# Skipped vs the PC pull: dashboard timers (browser only) and the artifact republish.
# (The Toolbox public-profile API refuses non-browser requests (403), so the save comes from the upload page.)
name: zack-pull
on:
  push:
    paths: ['inbox/zack/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zack-pull
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: accounts/brother/requirements.txt}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install
        run: |
          pip install -q -r accounts/brother/requirements.txt
          # the pipeline scripts expect /home/claude/work
          sudo mkdir -p /home/claude && sudo chown "$USER" /home/claude

      - name: Read the uploaded save
        run: |
          python3 - <<'EOF'
          import json, gzip, base64
          j = json.load(gzip.open('inbox/zack/raw.json.gz'))
          if 'data' not in j:  # Toolbox "Copy raw data" = bare save: add the stored roster order
            assert 'CogO' in j, 'not a Toolbox raw save'
            cog = j['CogO']; cog = json.loads(cog) if isinstance(cog, str) else cog
            names = {k[7:] for k in cog if k.startswith('Player_')}
            prev = open('snapshots/LATEST').read().strip()
            order = json.load(gzip.open(f'snapshots/{prev}/raw.json.gz'))['charNames']
            assert names == set(order), f'roster changed: save has {sorted(names)}, stored {order}'
            j = {'data': j, 'charNames': order}
          assert len(j.get('charNames', [])) == 11, 'expected 11 characters'
          j.pop('parsedData', None)
          raw = json.dumps(j).encode()
          b64 = base64.b64encode(gzip.compress(raw)).decode()
          json.dump([{'text': f'GZB64|{len(b64)}|{b64}|END|'}], open('/tmp/pull.json', 'w'))
          ta = j['data']['TimeAway']; ta = json.loads(ta) if isinstance(ta, str) else ta
          print('save ok:', len(raw), 'bytes, GlobalTime', ta['GlobalTime'])
          EOF

      - name: Snapshot (decode, AutoReview, Toolbox parser, data check)
        run: tools/snapshot.sh /tmp/pull.json

      - name: Pipeline + cards
        run: |
          AR=/home/claude/work/ar/mysite; REPO="$PWD"
          pip install -q rapidfuzz
          for s in model/ledger.py model/coins.py model/buffs.py model/mechanics.py rinse/rinse.py model/plan.py model/acquire.py; do
            python3 "$s" > /tmp/step.log 2>&1 && tail -1 /tmp/step.log | sed "s|^|[$s] |" || { echo "::warning::$s failed"; tail -5 /tmp/step.log; }
          done
          (cd "$AR" && PYTHONPATH=".:$REPO/model" python3 "$REPO/model/cards2.py") || echo "::warning::cards2 failed"
          for s in report decide cards3; do
            (cd "$AR" && PYTHONPATH=".:$REPO/model" python3 "$REPO/model/$s.py") || { echo "::error::$s failed"; exit 1; }
          done
          test -f "plans/cards4_$(cat snapshots/LATEST).md" || { echo "::error::cards4 missing"; exit 1; }

      - name: Save to the repo
        run: |
          S=$(cat snapshots/LATEST)
          git config user.name "zack-pull[bot]"
          git config user.email "zack-pull@users.noreply.github.com"
          git add snapshots plans reports dashboard state
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "pull: save $S (Action, phone upload)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          python3 -c "import json,datetime as d;m=json.load(open('snapshots/$S/meta.json'));print('Save', m['game_save_utc'], 'UTC')" >> "$GITHUB_STEP_SUMMARY"
